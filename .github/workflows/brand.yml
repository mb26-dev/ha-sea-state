name: Build brand images

on:
  push:
    paths:
      - "brand_src/**"
      - ".github/workflows/brand.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    name: Render PNG brand images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install renderer
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
          pip install pillow
      - name: Render
        run: python brand_src/make_brand.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/sea_state/brand
          git diff --cached --quiet || (git commit -m "Render brand images" && git push)
