<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Animated Offshore Gale Storm Marker">
  <defs>
    <linearGradient id="cloudGradST" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="45%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="cloudRimST" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="waveFrontST" x1="15%" y1="100%" x2="85%" y2="0%">
      <stop offset="0%" stop-color="#042f49" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="88%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="waveBackST" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <linearGradient id="ringGradST" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="shadowST" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#020617" flood-opacity="0.8" />
    </filter>

    <clipPath id="clipST">
      <circle cx="64" cy="64" r="54" />
    </clipPath>
  </defs>

  <!-- Outer Storm Wind-Field Ring (Dashed, Non-Spiral) -->
  <circle cx="64" cy="64" r="56" fill="none" stroke="url(#ringGradST)" stroke-width="3.2" stroke-dasharray="10 4" stroke-linecap="round" filter="url(#shadowST)" />

  <!-- Fully Transparent Interior Clipped to Ring -->
  <g clip-path="url(#clipST)" filter="url(#shadowST)">
    <!-- Dark Heavy Gale Storm Cloud -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="-2 0; 2.5 0; -2 0" keyTimes="0; 0.5; 1" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" dur="2.6s" repeatCount="indefinite" />
      <path d="M 33 54 C 24 54, 19 47, 22 39 C 24 33, 31 30, 38 32 C 42 22, 55 18, 65 23 C 72 19, 83 22, 87 30 C 96 30, 103 37, 102 45 C 101 51, 95 54, 88 54 Z" fill="url(#cloudGradST)" stroke="url(#cloudRimST)" stroke-width="1.4" stroke-linejoin="round" />
      <!-- Subtle Internal Cloud Turbulence Shadow -->
      <path d="M 34 48 C 46 45, 62 46, 76 44 C 84 43, 91 45, 95 48" fill="none" stroke="#64748b" stroke-width="1.3" stroke-opacity="0.55" stroke-linecap="round" />
    </g>

    <!-- Strong Linear Beaufort 8+ Gale Wind Gusts (Strictly Linear/Horizontal, No Spiral) -->
    <g fill="none" stroke-linecap="round">
      <path d="M 22 61 L 68 61 C 72 61, 74 58, 71 56" stroke="#e0f2fe" stroke-width="2.1">
        <animateTransform attributeName="transform" type="translate" values="-8 0; 12 0; -8 0" dur="1.4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.25; 1; 0.25" dur="1.4s" repeatCount="indefinite" />
      </path>
      <path d="M 34 67 L 94 67 C 98 67, 100 64, 97 62" stroke="#38bdf8" stroke-width="2">
        <animateTransform attributeName="transform" type="translate" values="-10 0; 10 0; -10 0" dur="1.2s" begin="0.3s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.25; 0.95; 0.25" dur="1.2s" begin="0.3s" repeatCount="indefinite" />
      </path>
      <path d="M 26 73 L 78 73" stroke="#bae6fd" stroke-width="1.6">
        <animateTransform attributeName="transform" type="translate" values="-6 0; 14 0; -6 0" dur="1.3s" begin="0.6s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.2; 0.85; 0.2" dur="1.3s" begin="0.6s" repeatCount="indefinite" />
      </path>
    </g>

    <!-- High Steep Offshore Storm Swells (Background Layer) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="3 1.5; -3 -1.5; 3 1.5" dur="2.2s" repeatCount="indefinite" />
      <path d="M 12 92 C 24 85, 34 73, 44 71 C 54 73, 62 84, 74 72 C 84 68, 96 80, 114 91 L 114 96 L 12 96 Z" fill="url(#waveBackST)" opacity="0.82" />
    </g>

    <!-- High Steep Offshore Storm Waves (Foreground Layer with Whitecaps) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="-3 2; 3 -2; -3 2" dur="1.9s" repeatCount="indefinite" />
      <path d="M 10 95 C 22 90, 32 76, 42 74 C 52 76, 60 88, 72 72 C 82 69, 94 84, 116 94 C 84 99, 42 99, 10 95 Z" fill="url(#waveFrontST)" />
      <!-- Crisp Whitecap Wave Peaks -->
      <path d="M 33 80 C 37 75, 40 74, 42 74 C 45 74, 48 77, 51 80" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" />
      <path d="M 63 80 C 67 74, 70 72, 72 72 C 75 72, 79 76, 82 80" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>
</svg>