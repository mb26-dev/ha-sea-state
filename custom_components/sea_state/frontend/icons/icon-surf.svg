<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Surf Icon">
  <defs>
    <linearGradient id="waveGradSF" x1="10%" y1="100%" x2="90%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="55%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="boardGradSF" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="55%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ffedd5" />
    </linearGradient>

    <linearGradient id="suitGradSF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Dynamic Ocean Wave Base -->
  <path d="M 3.5 26.5 C 10.5 25.5, 16.5 21.5, 21.5 15.5 C 24 12.5, 27.5 13, 28.5 16.5 C 26.5 15.5, 24.5 16.5, 24.2 18.8 C 23.9 21.2, 25.8 24, 28.5 26 C 20.5 27.5, 11 27.5, 3.5 26.5 Z" fill="url(#waveGradSF)" />

  <!-- Crisp White Wave Crest & Wake Spray -->
  <path d="M 5 25.8 C 11.5 24.5, 17 20.8, 21.5 15.5 C 23.8 12.8, 27.2 13.2, 28.5 16.5" fill="none" stroke="#e0f2fe" stroke-width="1.7" stroke-linecap="round" />
  <path d="M 4.5 23.5 Q 8.5 22.5 11.5 20.8" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />

  <!-- Sleek Surfboard -->
  <path d="M 8 21.8 C 10.5 19.2, 17.8 16.2, 22.2 15.6 C 23 15.5, 23.2 16, 22.4 16.7 C 18.5 19.5, 11.5 22.4, 8 22.4 C 7.4 22.4, 7.5 22.1, 8 21.8 Z" fill="url(#boardGradSF)" />

  <!-- Athletic Surfer Silhouette with Subtle Rim Light for Dark UI Pills -->
  <g fill="url(#suitGradSF)" stroke="#7dd3fc" stroke-width="0.45" stroke-linejoin="round">
    <!-- Bent Legs in Surf Stance -->
    <path d="M 13.2 14.2 C 12.1 16, 11.6 17.5, 12.6 19.5 L 14.3 19 C 13.7 17.5, 14.1 16.3, 15.3 15.1 C 16.6 16.3, 17.8 17.2, 19.2 17.8 L 20.3 16.4 C 18.8 15.4, 17.5 14.4, 16.4 13.3 Z" />
    <!-- Torso and Outstretched Balance Arms -->
    <path d="M 7.8 10.5 C 9.8 10.2, 12 9.8, 13.8 9.6 C 16 9, 18.5 8.1, 20.8 7.1 L 21.5 8.6 C 19.4 9.7, 17.4 10.5, 15.9 11 L 16.4 14.4 L 12.9 14.8 L 12.7 11.2 C 11 11.4, 9.2 11.5, 7.6 11.4 Z" />
  </g>

  <!-- Vibrant Orange Wetsuit Chest Accent -->
  <path d="M 14.3 10.2 L 14.8 14.0" fill="none" stroke="#f97316" stroke-width="1.2" stroke-linecap="round" />

  <!-- Surfer Head -->
  <circle cx="14.7" cy="6.6" r="2.1" fill="#f1c27d" />
  <path d="M 12.6 6.2 C 12.8 4.6, 14.5 4.1, 16.1 4.7 C 16.6 4.9, 16.9 5.5, 16.8 6 C 15.5 5.6, 13.8 5.7, 12.6 6.2 Z" fill="#0f172a" />
</svg>