<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Animated Surfing Marker">
  <defs>
    <linearGradient id="waveBodyR" x1="15%" y1="100%" x2="85%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="85%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>

    <linearGradient id="waveLipR" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <linearGradient id="boardGradR" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="45%" stop-color="#14b8a6" />
      <stop offset="85%" stop-color="#5eead4" />
      <stop offset="100%" stop-color="#f0fdfa" />
    </linearGradient>

    <linearGradient id="suitGradR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <filter id="shadowR" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#020617" flood-opacity="0.75" />
    </filter>

    <clipPath id="clipR">
      <circle cx="64" cy="64" r="54" />
    </clipPath>
  </defs>

  <g clip-path="url(#clipR)" filter="url(#shadowR)">
    <!-- Rolling Ocean Wave -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="-3 3; 3 -3; -3 3" keyTimes="0; 0.5; 1" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" dur="2.2s" repeatCount="indefinite" />
      <path d="M 12 91 C 37 88, 57 72, 74 49 C 84 36, 102 36, 107 48 C 97 43, 87 50, 88 61 C 89 72, 101 84, 115 89 C 82 94, 43 94, 12 91 Z" fill="url(#waveBodyR)" />
      <path d="M 37 90 C 56 83, 71 70, 81 54" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.75" stroke-linecap="round" />
      <path d="M 55 90 C 70 84, 81 74, 87 63" fill="none" stroke="#7dd3fc" stroke-width="1.2" stroke-opacity="0.6" stroke-linecap="round" />
      <!-- Pulsing Foam Crest -->
      <path d="M 20 90 C 43 86, 59 70, 74 49 C 83 37, 101 37, 106 47" fill="none" stroke="url(#waveLipR)" stroke-width="2.8" stroke-linecap="round">
        <animate attributeName="stroke-width" values="2.2; 3.8; 2.2" dur="2.2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.8; 1; 0.8" dur="2.2s" repeatCount="indefinite" />
      </path>
    </g>

    <!-- Carving Surfer -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="-4 5; 4 -5; -4 5" keyTimes="0; 0.5; 1" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" dur="2.2s" repeatCount="indefinite" />
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-7 55 68; 6 55 68; -7 55 68" keyTimes="0; 0.5; 1" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" dur="2.2s" repeatCount="indefinite" />

        <!-- Animated Wake Spray -->
        <path d="M 28 79 Q 40 75 49 71" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round">
          <animate attributeName="opacity" values="0.35; 1; 0.35" dur="1.1s" repeatCount="indefinite" />
        </path>
        <path d="M 33 82 Q 43 78 50 75" fill="none" stroke="#67e8f9" stroke-width="1.5" stroke-linecap="round">
          <animate attributeName="opacity" values="0.9; 0.3; 0.9" dur="1.1s" repeatCount="indefinite" />
        </path>

        <!-- Surfboard and Fin -->
        <path d="M 46 73 L 43.5 76.5 L 49.5 74 Z" fill="#0f766e" />
        <path d="M 41 74.5 C 46 69.5, 61 63.5, 70 62 C 71.5 61.8, 72 62.8, 70.5 64 C 63 69.5, 48 75.5, 41 75.5 C 40 75.5, 40.2 75, 41 74.5 Z" fill="url(#boardGradR)" stroke="#042f49" stroke-width="0.85" />

        <!-- Surfer Body -->
        <g fill="url(#suitGradR)" stroke="#e0f2fe" stroke-width="0.6" stroke-linejoin="round">
          <path d="M 50.5 57.5 C 48.5 61, 47.5 64, 49.5 68.5 L 52.5 67.5 C 51.2 64.2, 52 62, 54.5 59.5 C 57 62, 59.5 63.8, 62.2 65 L 64.2 62.5 C 61.5 60.5, 59 58.5, 57 56.2 Z" />
          <path d="M 40.5 47.5 C 44 46.8, 48 46.5, 51.5 46.5 C 56 45.5, 61 44, 65.5 42.2 L 66.8 45 C 62.5 47, 58.5 48.5, 56 49.5 L 57.2 57 L 50.2 58 L 49.8 50 C 46.5 50.2, 43 50.2, 40 49.8 Z" />
        </g>
        <path d="M 52.5 48 L 53.5 56" fill="none" stroke="#38bdf8" stroke-width="0.9" stroke-linecap="round" />
        <circle cx="53.5" cy="40" r="3.6" fill="#f1c27d" stroke="#0f172a" stroke-width="0.6" />
        <path d="M 50 39.2 C 50.4 36.2, 56.6 36.2, 57 39.2 C 55 38.2, 52 38.2, 50 39.2 Z" fill="#1e1b18" />
      </g>
    </g>

    <!-- Crest Foam Droplets -->
    <g fill="#ffffff">
      <circle cx="95" cy="39" r="1.8">
        <animate attributeName="cy" values="41; 32; 41" dur="1.4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.2; 1; 0.2" dur="1.4s" repeatCount="indefinite" />
      </circle>
      <circle cx="103" cy="42" r="1.5">
        <animate attributeName="cy" values="44; 35; 44" dur="1.4s" begin="0.45s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.2; 1; 0.2" dur="1.4s" begin="0.45s" repeatCount="indefinite" />
      </circle>
      <circle cx="88" cy="37" r="1.4">
        <animate attributeName="cy" values="39; 30; 39" dur="1.4s" begin="0.9s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.2; 1; 0.2" dur="1.4s" begin="0.9s" repeatCount="indefinite" />
      </circle>
    </g>
  </g>

  <!-- Crisp White Outer Ring -->
  <circle cx="64" cy="64" r="56" fill="none" stroke="#ffffff" stroke-width="4.5" filter="url(#shadowR)" />
</svg>