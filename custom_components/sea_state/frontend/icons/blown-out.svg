<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Animated Blown Out Surfer Marker">
  <defs>
    <linearGradient id="chopGradBO" x1="15%" y1="100%" x2="85%" y2="0%">
      <stop offset="0%" stop-color="#075985" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="85%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <linearGradient id="boardGradBO" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#c2410c" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ffedd5" />
    </linearGradient>

    <linearGradient id="suitGradBO" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="ringGradBO" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="45%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <filter id="shadowBO" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#020617" flood-opacity="0.78" />
    </filter>

    <clipPath id="clipBO">
      <circle cx="64" cy="64" r="54" />
    </clipPath>
  </defs>

  <!-- Fully Transparent Interior Clipped to Orange Ring -->
  <g clip-path="url(#clipBO)" filter="url(#shadowBO)">
    <!-- Strong Onshore Wind Streaks Sweeping Right-to-Left -->
    <g fill="none" stroke-linecap="round">
      <path d="M 106 34 Q 82 31 58 35" stroke="#ffffff" stroke-width="2" opacity="0.85">
        <animateTransform attributeName="transform" type="translate" values="10 0; -14 1; 10 0" dur="1.3s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.2; 0.9; 0.2" dur="1.3s" repeatCount="indefinite" />
      </path>
      <path d="M 110 47 Q 86 44 64 48" stroke="#fdba74" stroke-width="1.7" opacity="0.8">
        <animateTransform attributeName="transform" type="translate" values="12 0; -12 1; 12 0" dur="1.1s" begin="0.3s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.2; 0.85; 0.2" dur="1.1s" begin="0.3s" repeatCount="indefinite" />
      </path>
      <path d="M 102 61 Q 82 58 66 61" stroke="#e0f2fe" stroke-width="1.5" opacity="0.75">
        <animateTransform attributeName="transform" type="translate" values="8 0; -12 1; 8 0" dur="1.2s" begin="0.6s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.2; 0.8; 0.2" dur="1.2s" begin="0.6s" repeatCount="indefinite" />
      </path>
    </g>

    <!-- Choppy Blown-Out Wave (Jagged Crest Ruined by Onshore Wind) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="-2 1.8; 2 -1.8; -2 1.8" dur="1.4s" repeatCount="indefinite" />
      <path d="M 14 91 C 32 88, 46 78, 60 64 L 66 56 L 73 59 L 81 50 L 89 55 L 97 49 C 102 56, 105 72, 114 89 C 82 94, 44 94, 14 91 Z" fill="url(#chopGradBO)" />
      <!-- Choppy Whitewater Crest & Blowback Spray -->
      <path d="M 22 89 C 38 85, 50 75, 60 64 L 66 56 L 73 59 L 81 50 L 89 55 L 97 49" fill="none" stroke="#f0f9ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Messy Chop Lines -->
      <path d="M 38 86 Q 52 80 65 72" fill="none" stroke="#7dd3fc" stroke-width="1.2" stroke-opacity="0.7" stroke-linecap="round" />
      <path d="M 62 88 Q 78 82 92 75" fill="none" stroke="#bae6fd" stroke-width="1.2" stroke-opacity="0.65" stroke-linecap="round" />
    </g>

    <!-- Surfer Struggling in Chop with Wind-Blown Hair -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="-1.5 2; 1.5 -2; -1.5 2" dur="1.4s" repeatCount="indefinite" />
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-8 52 68; 5 52 68; -8 52 68" dur="1.4s" repeatCount="indefinite" />

        <!-- Choppy Wake Spray -->
        <path d="M 28 79 Q 38 76 46 73" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
        <path d="M 32 82 Q 40 79 47 77" fill="none" stroke="#fdba74" stroke-width="1.4" stroke-linecap="round" />

        <!-- Surfboard Bouncing on Chop -->
        <path d="M 43 74.5 L 40.5 78 L 46.5 75.5 Z" fill="#9a3412" />
        <path d="M 38 76 C 43 71, 58 65, 67 63.5 C 68.5 63.3, 69 64.3, 67.5 65.5 C 60 71, 45 77, 38 77 C 37 77, 37.2 76.5, 38 76 Z" fill="url(#boardGradBO)" stroke="#0f172a" stroke-width="0.85" />

        <!-- Surfer Body Leaning Into Wind -->
        <g fill="url(#suitGradBO)" stroke="#e0f2fe" stroke-width="0.6" stroke-linejoin="round">
          <path d="M 47.5 59 C 45.5 62.5, 44.5 65.5, 46.5 70 L 49.5 69 C 48.2 65.7, 49 63.5, 51.5 61 C 54 63.5, 56.5 65.3, 59.2 66.5 L 61.2 64 C 58.5 62, 56 60, 54 57.7 Z" />
          <path d="M 38 49.5 C 41.5 48.8, 45.5 48.2, 49 48 C 53.5 47, 58.5 45.8, 63 44.2 L 64.2 47 C 60 48.8, 56 50.2, 53.2 51 L 54.2 58.5 L 47.2 59.5 L 47 51.5 C 43.8 51.8, 40.5 51.8, 37.5 51.5 Z" />
        </g>
        <path d="M 49.8 49.5 L 50.8 57.5" fill="none" stroke="#fb923c" stroke-width="0.9" stroke-linecap="round" />

        <!-- Head with Wild Wind-Blown Hair Streaming Left -->
        <circle cx="51" cy="41.5" r="3.7" fill="#f1c27d" stroke="#0f172a" stroke-width="0.6" />
        <path d="M 54.4 40.5 C 53.5 37.2, 48.5 37, 45.5 38.2 C 42.5 39.4, 39.5 38.8, 37.5 37.5 C 39.5 40.5, 43 41.2, 46.5 40.5 C 48.5 40.2, 51.8 40, 54.4 40.5 Z" fill="#1e1b18">
          <animateTransform attributeName="transform" type="skewY" values="-4; 5; -4" dur="0.7s" repeatCount="indefinite" />
        </path>
      </g>
    </g>

    <!-- Wind-Blown Sea Spray Droplets Flying Left -->
    <g fill="#ffffff">
      <circle cx="78" cy="46" r="1.7">
        <animate attributeName="cx" values="82; 62; 48" dur="1.1s" repeatCount="indefinite" />
        <animate attributeName="cy" values="46; 43; 45" dur="1.1s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.2; 1; 0" dur="1.1s" repeatCount="indefinite" />
      </circle>
      <circle cx="68" cy="52" r="1.4">
        <animate attributeName="cx" values="72; 52; 38" dur="1.1s" begin="0.35s" repeatCount="indefinite" />
        <animate attributeName="cy" values="52; 49; 51" dur="1.1s" begin="0.35s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.2; 1; 0" dur="1.1s" begin="0.35s" repeatCount="indefinite" />
      </circle>
      <circle cx="90" cy="44" r="1.5">
        <animate attributeName="cx" values="94; 74; 60" dur="1.1s" begin="0.7s" repeatCount="indefinite" />
        <animate attributeName="cy" values="44; 41; 43" dur="1.1s" begin="0.7s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.2; 1; 0" dur="1.1s" begin="0.7s" repeatCount="indefinite" />
      </circle>
    </g>
  </g>

  <!-- Crisp Orange Outer Ring -->
  <circle cx="64" cy="64" r="56" fill="none" stroke="url(#ringGradBO)" stroke-width="4.8" filter="url(#shadowBO)" />
</svg>