<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Animated Too Big Wave Marker">
  <defs>
    <linearGradient id="waveBodyTB" x1="15%" y1="100%" x2="85%" y2="0%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="42%" stop-color="#0369a1" />
      <stop offset="80%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="barrelCoreTB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041e33" />
      <stop offset="65%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="waveLipTB" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="45%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <linearGradient id="flagGradTB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="55%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <linearGradient id="ringGradTB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="45%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <filter id="shadowTB" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#020617" flood-opacity="0.78" />
    </filter>

    <clipPath id="clipTB">
      <circle cx="64" cy="64" r="54" />
    </clipPath>
  </defs>

  <!-- Fully Transparent Interior Clipped to Red Warning Ring -->
  <g clip-path="url(#clipTB)" filter="url(#shadowTB)">
    <!-- Massive Towering Pipeline Barrel Wave (No Surfer) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="-2 2.5; 2.5 -2.5; -2 2.5" keyTimes="0; 0.5; 1" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" dur="2.1s" repeatCount="indefinite" />

      <!-- Main Massive Wave Wall -->
      <path d="M 12 92 C 36 86, 52 60, 68 33 C 81 14, 105 16, 111 38 C 100 30, 88 35, 85 49 C 82 63, 94 78, 115 88 C 82 95, 42 95, 12 92 Z" fill="url(#waveBodyTB)" />

      <!-- Deep Hollow Barrel Cavity -->
      <path d="M 73 86 C 74 64, 83 44, 96 42 C 103 41, 107 46, 106 53 C 97 50, 91 56, 90 67 C 89 76, 95 83, 104 87 Z" fill="url(#barrelCoreTB)" opacity="0.85" />

      <!-- Steep Wave Face Rib Lines -->
      <path d="M 32 90 C 50 78, 63 58, 74 36" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.75" stroke-linecap="round" />
      <path d="M 48 91 C 62 79, 72 62, 81 43" fill="none" stroke="#7dd3fc" stroke-width="1.2" stroke-opacity="0.6" stroke-linecap="round" />

      <!-- Heavy Throwing Lip Hugging Crest -->
      <path d="M 20 90 C 42 82, 56 57, 70 32 C 82 14, 104 16, 111 38" fill="none" stroke="url(#waveLipTB)" stroke-width="3.6" stroke-linecap="round">
        <animate attributeName="stroke-width" values="3.0; 4.4; 3.0" dur="2.1s" repeatCount="indefinite" />
      </path>

      <!-- Exploding Foam Plume at Impact Zone -->
      <g fill="#ffffff">
        <circle cx="99" cy="43" r="3.4" opacity="0.92">
          <animate attributeName="r" values="2.6; 4.2; 2.6" dur="1.4s" repeatCount="indefinite" />
        </circle>
        <circle cx="105" cy="48" r="2.7" opacity="0.88">
          <animate attributeName="r" values="3.4; 2.0; 3.4" dur="1.4s" repeatCount="indefinite" />
        </circle>
        <circle cx="94" cy="49" r="2.3" opacity="0.82" />
      </g>
    </g>

    <!-- Flying Mist and Spray Over Crest -->
    <g fill="#ffffff">
      <circle cx="88" cy="21" r="1.9">
        <animate attributeName="cy" values="23; 14; 23" dur="1.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.25; 1; 0.25" dur="1.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="99" cy="23" r="1.6">
        <animate attributeName="cy" values="25; 16; 25" dur="1.5s" begin="0.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.25; 1; 0.25" dur="1.5s" begin="0.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="108" cy="29" r="1.5">
        <animate attributeName="cy" values="31; 22; 31" dur="1.5s" begin="1s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.25; 1; 0.25" dur="1.5s" begin="1s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Shore Sandbar and Red Beach Warning Flag (Left Foreground) -->
    <g>
      <path d="M 14 93 C 22 87, 36 87, 45 93 Z" fill="#d97706" stroke="#0f172a" stroke-width="0.7" />
      <line x1="28" y1="89" x2="28" y2="56" stroke="#f8fafc" stroke-width="2.2" stroke-linecap="round" />
      <circle cx="28" cy="55.5" r="1.6" fill="#fca5a5" />
      <g>
        <animateTransform attributeName="transform" type="skewY" values="-5; 6; -5" keyTimes="0; 0.5; 1" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" dur="1.1s" repeatCount="indefinite" />
        <path d="M 29 57 L 48 61.5 L 29 67 Z" fill="url(#flagGradTB)" stroke="#7f1d1d" stroke-width="0.7" stroke-linejoin="round" />
      </g>
    </g>
  </g>

  <!-- Crisp Red Warning Outer Ring -->
  <circle cx="64" cy="64" r="56" fill="none" stroke="url(#ringGradTB)" stroke-width="4.8" filter="url(#shadowTB)" />
</svg>