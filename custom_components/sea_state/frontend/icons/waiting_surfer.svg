<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Animated Waiting Surfer Marker">
  <defs>
    <linearGradient id="boardGradS" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>

    <linearGradient id="suitGradS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="waterLineS" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="28%" stop-color="#e0f2fe" stop-opacity="0.95" />
      <stop offset="72%" stop-color="#67e8f9" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.15" />
    </linearGradient>

    <filter id="shadowS" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#020617" flood-opacity="0.75" />
    </filter>

    <clipPath id="clipS">
      <circle cx="64" cy="64" r="54" />
    </clipPath>
  </defs>

  <!-- Fully Transparent Interior Clipped to Ring -->
  <g clip-path="url(#clipS)" filter="url(#shadowS)">
    <!-- Subtle Animated Sea Breeze Lines -->
    <g stroke="#e0f2fe" stroke-linecap="round" fill="none">
      <line x1="68" y1="47" x2="84" y2="47" stroke-width="1.3">
        <animate attributeName="x1" values="66; 74; 66" dur="2.8s" repeatCount="indefinite" />
        <animate attributeName="x2" values="82; 90; 82" dur="2.8s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.2; 0.7; 0.2" dur="2.8s" repeatCount="indefinite" />
      </line>
      <line x1="42" y1="53" x2="53" y2="53" stroke-width="1.2">
        <animate attributeName="x1" values="40; 47; 40" dur="2.8s" begin="0.8s" repeatCount="indefinite" />
        <animate attributeName="x2" values="51; 58; 51" dur="2.8s" begin="0.8s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.15; 0.6; 0.15" dur="2.8s" begin="0.8s" repeatCount="indefinite" />
      </line>
    </g>

    <!-- Buoyant Floating Surfboard and Sitting Surfer -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 2.4; 0 -2.4; 0 2.4" keyTimes="0; 0.5; 1" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" dur="2.4s" repeatCount="indefinite" />
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-3 64 68; 3 64 68; -3 64 68" keyTimes="0; 0.5; 1" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" dur="2.4s" repeatCount="indefinite" />

        <!-- Dangling Legs Submerged Below Board -->
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-4 63 69; 5 63 69; -4 63 69" keyTimes="0; 0.5; 1" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" dur="2.4s" repeatCount="indefinite" />
          <path d="M 60.5 68.5 L 63.5 75.5 L 63 82.5 C 62.9 84, 65.5 84, 65.7 82.5 L 66.5 74.8 L 64 68.5 Z" fill="url(#suitGradS)" stroke="#e0f2fe" stroke-width="0.55" stroke-linejoin="round" />
        </g>

        <!-- Surfboard Fin -->
        <path d="M 43 70.5 L 39.5 76.5 L 47.5 71.5 Z" fill="#92400e" />

        <!-- Sleek Warm-Amber Surfboard -->
        <path d="M 36 68.5 C 39 65.5, 79 65.5, 90 68.5 C 92.5 69.2, 92.5 70.6, 89 71.4 C 76 73.2, 40 72.5, 36 68.5 Z" fill="url(#boardGradS)" stroke="#0f172a" stroke-width="0.85" />
        <path d="M 42 68.2 C 57 67, 74 67, 86 68.6" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.75" stroke-linecap="round" />

        <!-- Upright Sitting Surfer Torso and Balancing Arm -->
        <g fill="url(#suitGradS)" stroke="#e0f2fe" stroke-width="0.6" stroke-linejoin="round">
          <!-- Torso and Seated Hip -->
          <path d="M 57.5 54.5 C 57.5 53, 62.5 53, 63 54.8 L 64.2 66.8 C 64.3 68.2, 62.5 69, 60.5 69 L 57.8 68.8 C 56.8 68.6, 56.8 66.8, 57.2 64.5 Z" />
          <!-- Forward Arm Resting Hand on Board -->
          <path d="M 61.5 56 L 69.5 64.5 C 70.4 65.5, 69 67, 67.8 66 L 60.5 58.8 Z" />
        </g>

        <!-- Wetsuit Cyan Accent Line -->
        <path d="M 59.5 56 L 59.5 65.5" fill="none" stroke="#38bdf8" stroke-width="0.9" stroke-linecap="round" />

        <!-- Surfer Head Looking Out to Horizon -->
        <circle cx="60.5" cy="48.5" r="4.2" fill="#f1c27d" stroke="#0f172a" stroke-width="0.6" />
        <path d="M 56.6 47.6 C 57.2 44.1, 63.8 44.1, 64.4 47.6 C 62.2 46.4, 58.8 46.4, 56.6 47.6 Z" fill="#1e1b18" />
      </g>
    </g>

    <!-- Animated Waterline Ripples -->
    <path d="M 24 72.2 Q 46 70.4 64 72.2 T 104 72.2" fill="none" stroke="url(#waterLineS)" stroke-width="2.3" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="-3.5 0; 3.5 0; -3.5 0" dur="2.4s" repeatCount="indefinite" />
    </path>
    <path d="M 35 77 Q 53 75.5 66 77 T 93 77" fill="none" stroke="#7dd3fc" stroke-width="1.4" stroke-opacity="0.8" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="3 0; -3 0; 3 0" dur="2.4s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Crisp White Outer Ring -->
  <circle cx="64" cy="64" r="56" fill="none" stroke="#ffffff" stroke-width="4.5" filter="url(#shadowS)" />
</svg>