<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Animated Cyclone Vortex Marker">
  <defs>
    <radialGradient id="armGradC" cx="50%" cy="50%" r="50%">
      <stop offset="16%" stop-color="#ffffff" stop-opacity="0.96" />
      <stop offset="52%" stop-color="#e0f2fe" stop-opacity="0.86" />
      <stop offset="82%" stop-color="#38bdf8" stop-opacity="0.58" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.08" />
    </radialGradient>

    <radialGradient id="spineGradC" cx="50%" cy="50%" r="50%">
      <stop offset="18%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="68%" stop-color="#7dd3fc" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </radialGradient>

    <radialGradient id="eyeCoreC" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#27496d" />
      <stop offset="65%" stop-color="#142d4c" />
      <stop offset="100%" stop-color="#08182b" />
    </radialGradient>

    <linearGradient id="ringGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <filter id="shadowC" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#020617" flood-opacity="0.78" />
    </filter>

    <filter id="glowC" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="clipC">
      <circle cx="64" cy="64" r="54" />
    </clipPath>
  </defs>

  <!-- Outer Dashed Cyan Wind-Field Ring (Slowly Rotating) -->
  <circle cx="64" cy="64" r="56" fill="none" stroke="url(#ringGradC)" stroke-width="2.5" stroke-dasharray="6.5 5" stroke-linecap="round" filter="url(#shadowC)">
    <animateTransform attributeName="transform" type="rotate" from="0 64 64" to="360 64 64" dur="18s" repeatCount="indefinite" />
  </circle>

  <!-- Secondary Subtle Inner Wind-Band Ring (Counter-Rotating) -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="#38bdf8" stroke-width="1.1" stroke-opacity="0.38" stroke-dasharray="3.5 8.5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="360 64 64" to="0 64 64" dur="14s" repeatCount="indefinite" />
  </circle>

  <!-- Fully Transparent Interior Clipped to Wind Ring -->
  <g clip-path="url(#clipC)" filter="url(#shadowC)">
    <!-- Rotating 3-Arm Spiral Vortex -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 64 64" to="360 64 64" dur="4s" repeatCount="indefinite" />

      <!-- Arm 1 (0 deg) -->
      <g>
        <path d="M63.1 54.5 L65.8 53.7 L69.0 53.4 L72.4 53.8 L76.1 55.1 L79.8 57.3 L83.4 60.5 L86.6 64.6 L89.2 69.7 L90.8 75.7 L91.3 82.3 L90.4 89.2 L88.1 96.1 L84.3 102.5 L79.2 108.0 L73.1 112.2 L66.1 114.6 L58.7 115.0 L51.4 113.3 L44.4 109.6 L38.3 104.2 L33.4 97.4 L30.0 89.6 Q28.2 87.3 30.0 89.6 L33.7 97.1 L38.9 103.6 L45.3 108.7 L52.5 112.1 L60.1 113.4 L67.6 112.6 L74.6 109.9 L80.6 105.4 L85.4 99.4 L88.7 92.4 L90.4 84.9 L90.3 77.5 L88.6 70.6 L85.3 64.9 L81.0 60.5 L76.0 57.6 L70.9 56.1 L66.2 55.6 L62.3 55.7 L59.4 56.1 L57.5 56.3 L56.8 56.1 Z" fill="url(#armGradC)" stroke="#38bdf8" stroke-width="0.6" stroke-opacity="0.5" />
        <path d="M63.2 54.5 L65.5 54.6 L68.1 55.0 L71.0 55.9 L74.2 57.6 L77.5 60.2 L80.8 63.7 L83.8 68.1 L86.4 73.5 L88.2 79.7 L88.9 86.4 L88.3 93.3 L86.3 100.0 L82.8 106.1 L78.0 111.1 L72.1 114.7 L65.3 116.5 L58.1 116.2 L51.0 113.9 L44.4 109.6 L38.7 103.7 L34.2 96.6 L31.2 88.6" fill="none" stroke="url(#spineGradC)" stroke-width="1.6" stroke-linecap="round" filter="url(#glowC)" />
      </g>

      <!-- Arm 2 (120 deg) -->
      <g transform="rotate(120 64 64)">
        <path d="M63.1 54.5 L65.8 53.7 L69.0 53.4 L72.4 53.8 L76.1 55.1 L79.8 57.3 L83.4 60.5 L86.6 64.6 L89.2 69.7 L90.8 75.7 L91.3 82.3 L90.4 89.2 L88.1 96.1 L84.3 102.5 L79.2 108.0 L73.1 112.2 L66.1 114.6 L58.7 115.0 L51.4 113.3 L44.4 109.6 L38.3 104.2 L33.4 97.4 L30.0 89.6 Q28.2 87.3 30.0 89.6 L33.7 97.1 L38.9 103.6 L45.3 108.7 L52.5 112.1 L60.1 113.4 L67.6 112.6 L74.6 109.9 L80.6 105.4 L85.4 99.4 L88.7 92.4 L90.4 84.9 L90.3 77.5 L88.6 70.6 L85.3 64.9 L81.0 60.5 L76.0 57.6 L70.9 56.1 L66.2 55.6 L62.3 55.7 L59.4 56.1 L57.5 56.3 L56.8 56.1 Z" fill="url(#armGradC)" stroke="#38bdf8" stroke-width="0.6" stroke-opacity="0.5" />
        <path d="M63.2 54.5 L65.5 54.6 L68.1 55.0 L71.0 55.9 L74.2 57.6 L77.5 60.2 L80.8 63.7 L83.8 68.1 L86.4 73.5 L88.2 79.7 L88.9 86.4 L88.3 93.3 L86.3 100.0 L82.8 106.1 L78.0 111.1 L72.1 114.7 L65.3 116.5 L58.1 116.2 L51.0 113.9 L44.4 109.6 L38.7 103.7 L34.2 96.6 L31.2 88.6" fill="none" stroke="url(#spineGradC)" stroke-width="1.6" stroke-linecap="round" filter="url(#glowC)" />
      </g>

      <!-- Arm 3 (240 deg) -->
      <g transform="rotate(240 64 64)">
        <path d="M63.1 54.5 L65.8 53.7 L69.0 53.4 L72.4 53.8 L76.1 55.1 L79.8 57.3 L83.4 60.5 L86.6 64.6 L89.2 69.7 L90.8 75.7 L91.3 82.3 L90.4 89.2 L88.1 96.1 L84.3 102.5 L79.2 108.0 L73.1 112.2 L66.1 114.6 L58.7 115.0 L51.4 113.3 L44.4 109.6 L38.3 104.2 L33.4 97.4 L30.0 89.6 Q28.2 87.3 30.0 89.6 L33.7 97.1 L38.9 103.6 L45.3 108.7 L52.5 112.1 L60.1 113.4 L67.6 112.6 L74.6 109.9 L80.6 105.4 L85.4 99.4 L88.7 92.4 L90.4 84.9 L90.3 77.5 L88.6 70.6 L85.3 64.9 L81.0 60.5 L76.0 57.6 L70.9 56.1 L66.2 55.6 L62.3 55.7 L59.4 56.1 L57.5 56.3 L56.8 56.1 Z" fill="url(#armGradC)" stroke="#38bdf8" stroke-width="0.6" stroke-opacity="0.5" />
        <path d="M63.2 54.5 L65.5 54.6 L68.1 55.0 L71.0 55.9 L74.2 57.6 L77.5 60.2 L80.8 63.7 L83.8 68.1 L86.4 73.5 L88.2 79.7 L88.9 86.4 L88.3 93.3 L86.3 100.0 L82.8 106.1 L78.0 111.1 L72.1 114.7 L65.3 116.5 L58.1 116.2 L51.0 113.9 L44.4 109.6 L38.7 103.7 L34.2 96.6 L31.2 88.6" fill="none" stroke="url(#spineGradC)" stroke-width="1.6" stroke-linecap="round" filter="url(#glowC)" />
      </g>

      <!-- Outer Wind Streak Arcs -->
      <g fill="none" stroke="#e0f2fe" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.72">
        <path d="M21 44 A47 47 0 0 1 36 25" />
        <path d="M107 44 A47 47 0 0 1 109 69" />
        <path d="M52 109 A47 47 0 0 1 29 94" />
      </g>
    </g>

    <!-- Central Cyclone Eyewall and Calm Eye Core -->
    <g filter="url(#glowC)">
      <!-- Subtle Pulsing Outer Eyewall Halo -->
      <circle cx="64" cy="64" r="12" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-opacity="0.6">
        <animate attributeName="r" values="11; 14.5; 11" dur="2s" repeatCount="indefinite" />
        <animate attributeName="stroke-opacity" values="0.75; 0.15; 0.75" dur="2s" repeatCount="indefinite" />
      </circle>
      <!-- Crisp White Eyewall Ring -->
      <circle cx="64" cy="64" r="9.6" fill="url(#eyeCoreC)" stroke="#ffffff" stroke-width="3.5" />
    </g>
  </g>
</svg>