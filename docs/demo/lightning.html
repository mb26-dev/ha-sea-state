<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sea State lightning card</title>
<style>
  html, body { margin: 0; background: #141414; }
  #wrap { display: grid; grid-template-columns: repeat(2, 440px); gap: 24px; align-items: start; padding: 14px; width: max-content; }
</style>
</head>
<body>
<div id="wrap"></div>
<script type="module">
// Renders the lightning card for docs/images/lightning-card.jpg (render.py).
// Blitzortung has no public feed for a screenshot job, so this page uses simulated
// strikes: a thunderstorm moving in from the north-west towards Kuta, Bali.
const HOME = { lat: -8.718, lon: 115.169 };
const now = Date.now();
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

const states = {};
let n = 0;
// storm centre moves from 75 km NW to 18 km NW of home over two hours; newest strikes nearest
for (let i = 0; i < 70; i++) {
  const ageMin = 118 * (1 - i / 70) ** 1.3 + rnd() * 2;
  const f = 1 - ageMin / 120;
  const dist = 75 - 57 * f;
  const brg = (305 + (rnd() - 0.5) * 50) * Math.PI / 180;
  const spread = 4 + rnd() * 9;
  const dLat = (dist * Math.cos(brg) + (rnd() - 0.5) * spread) / 111;
  const dLon = (dist * Math.sin(brg) + (rnd() - 0.5) * spread) / (111 * Math.cos(HOME.lat * Math.PI / 180));
  const id = `geo_location.lightning_strike_${++n}`;
  states[id] = {
    entity_id: id,
    state: String(Math.round(dist)),
    attributes: { source: "blitzortung", latitude: HOME.lat + dLat, longitude: HOME.lon + dLon, publication_date: new Date(now - ageMin * 60000).toISOString() },
    last_changed: new Date(now - ageMin * 60000).toISOString(),
  };
}
const nearest = Object.values(states).sort((a, b) => Date.parse(b.attributes.publication_date) - Date.parse(a.attributes.publication_date))[0];
states["sensor.lightning_distance"] = { entity_id: "sensor.lightning_distance", state: nearest.state, attributes: { unit_of_measurement: "km" }, last_changed: nearest.last_changed };

const hass = {
  config: { latitude: HOME.lat, longitude: HOME.lon, time_zone: "Asia/Makassar" },
  locale: { language: "en" },
  states,
};

await import("../../custom_components/sea_state/frontend/sea-state-lightning.js");
const base = {
  title: "Lightning Watch",
  home_name: "Kuta",
  radius_km: 100,
  minutes: 120,
  height: 300,
  distance_entity: "sensor.lightning_distance",
  places: [
    { name: "Canggu", lat: -8.649, lon: 115.13, radius_km: 8 },
    { name: "Uluwatu", lat: -8.815, lon: 115.088, radius_km: 8 },
    { name: "Sanur", lat: -8.69, lon: 115.263, radius_km: 8 },
    { name: "Medewi", lat: -8.42, lon: 114.81, radius_km: 10 },
  ],
};
const configs = [
  { ...base, view: 1, views: [{ name: "Kuta", radius_km: 30 }, { name: "Radar", radius_km: 110 }, { name: "Bali", lat: -8.4, lon: 115.1, radius_km: 160 }] },
  { ...base, map: "satellite", list: 0, view: 0, views: [{ name: "Storm", lat: -8.45, lon: 114.95, radius_km: 70 }, { name: "Radar", radius_km: 110 }] },
];
window.__cards = configs.map((cfg) => {
  const card = document.createElement("sea-state-lightning-card");
  card.setConfig(cfg);
  document.getElementById("wrap").appendChild(card);
  card.hass = hass;
  return card;
});
</script>
</body>
</html>
